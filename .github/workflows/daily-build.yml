name: Daily site build

on:
    schedule:
        - cron: "17 2 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pages: write

concurrency:
    group: daily-site-build
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.18.0
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Commit updated site
              id: commit
              run: |
                  git add -A -- docs src/data/github-activity.json src/data/stats.json
                  if git diff --cached --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update site data and build"
                  git push origin HEAD:main
                  echo "changed=true" >> "$GITHUB_OUTPUT"
            - name: Publish updated site
              if: steps.commit.outputs.changed == 'true'
              run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
              env:
                  GH_TOKEN: ${{ github.token }}
